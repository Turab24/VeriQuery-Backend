spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
  flyway:
    clean-disabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: WARN
    com.enterpriseai.hub: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}
